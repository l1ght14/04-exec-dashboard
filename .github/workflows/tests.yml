name: tests

# No `branches:` filter on purpose. This repo's default branch is `master`, and a
# workflow listening only to `main` never runs -- it shows as "active" while
# producing zero runs, which reads as a passing project to anyone who does not
# open the Actions tab.
on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # tests/test_sql.py needs duckdb to load sql/*.sql and is skipped without it.
      - name: Test
        run: python -m pytest tests/ -q --junitxml=report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: report.xml