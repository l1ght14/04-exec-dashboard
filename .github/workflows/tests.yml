name: tests

on:
  # workflow_dispatch so CI can be re-run on demand; the initial gh repo create --push`n  # does not fire Actions, so without this a reviewer sees no checks at all.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # tests/test_sql.py needs duckdb to load sql/*.sql and is skipped without it.
      - name: Test
        run: python -m pytest tests/ -q --junitxml=report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: report.xml
